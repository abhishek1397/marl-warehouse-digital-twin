services:
  proxy:
    container_name: warehouse-proxy
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - warehouse-network

  backend:
    container_name: warehouse-backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      - API_HOST=${API_HOST:-0.0.0.0}
      - API_PORT=${API_PORT:-8000}
      - DEBUG=${DEBUG:-false}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - warehouse-network
    volumes:
      - backend-logs:/app/logs

  frontend:
    container_name: warehouse-frontend
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - warehouse-network

networks:
  warehouse-network:
    driver: bridge
    name: warehouse-marl-network

volumes:
  backend-logs:
    name: warehouse-backend-logs

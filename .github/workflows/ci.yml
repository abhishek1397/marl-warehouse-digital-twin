name: Continuous Integration (CI) Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # JOB 1: PYTHON BACKEND & MARL TEST SUITE
  # ============================================================================
  python-test:
    name: Python Test Suite & MARL Validation
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov

      - name: Run Pytest Test Suite
        run: |
          pytest --cov=backend/app --cov=marl --cov=simulator --cov-report=xml --cov-report=term

      - name: Upload Coverage Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-coverage-report
          path: coverage.xml
          retention-days: 7

  # ============================================================================
  # JOB 2: FRONTEND BUILD VERIFICATION
  # ============================================================================
  frontend-build:
    name: React Frontend Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Run Frontend Production Build
        working-directory: ./frontend
        run: npm run build

      - name: Upload Frontend Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-build
          path: frontend/dist
          retention-days: 7

  # ============================================================================
  # JOB 3: DOCKER IMAGE BUILD VERIFICATION
  # ============================================================================
  docker-verify:
    name: Docker Image & Compose Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        run: |
          docker build -t warehouse-backend:ci -f backend/Dockerfile .

      - name: Build Frontend Docker Image
        run: |
          docker build -t warehouse-frontend:ci -f frontend/Dockerfile .

      - name: Build Nginx Proxy Docker Image
        run: |
          docker build -t warehouse-proxy:ci -f nginx/Dockerfile .

      - name: Validate Docker Compose Config
        run: |
          docker compose config

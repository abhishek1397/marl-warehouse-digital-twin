# Development Override Configuration for Live Code Reloading
services:
  backend:
    ports:
      - "8000:8000"
    environment:
      - DEBUG=true
    volumes:
      - ./backend/app:/app/backend/app
      - ./simulator:/app/simulator
      - ./marl:/app/marl

  frontend:
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=development
